<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>BECA Assessment</title>
  <style>
    body { font-family: Arial; background: linear-gradient(135deg, #007bff, #0056b3); margin: 0; padding: 20px; min-height: 100vh; }
    .container { max-width: 500px; margin: 50px auto; background: white; padding: 40px; border-radius: 8px; }
    h1 { color: #007bff; text-align: center; }
    input { width: 100%; padding: 10px; margin: 10px 0; box-sizing: border-box; border: 1px solid #ddd; border-radius: 4px; }
    button { width: 100%; padding: 12px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; margin-top: 10px; }
    button:hover { background: #0056b3; }
  </style>
</head>
<body>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <div id="app">
    <div class="container">
      <h1>Testing...</h1>
      <p id="status">Initializing Supabase...</p>
    </div>
  </div>

  <script>
    var supabase = null;

    // Test initialization
    console.log('Page loaded');
    console.log('Supabase library available:', !!window.supabase);

    setTimeout(function() {
      console.log('After 1s - Supabase available:', !!window.supabase);

      if (window.supabase) {
        try {
          supabase = window.supabase.createClient(
            'https://fgzqgqwlyeubudnbxsmx.supabase.co',
            'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZnenFncXdseWV1YnVkbmJ4c214Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk0MTc5NTIsImV4cCI6MjA5NDk5Mzk1Mn0.J6lWx23ukNGihKgLtdCeoq4WOR75eSFyGYrb6_YS9q0'
          );
          console.log('✓ Supabase initialized');
          
          document.getElementById('app').innerHTML = `
            <div class="container">
              <h1>BECA Assessment</h1>
              <form onsubmit="handleLogin(event)">
                <input type="email" id="email" placeholder="Email" required>
                <input type="password" id="password" placeholder="Password" required>
                <button type="submit">Login</button>
              </form>
              <p id="message" style="color: red; display: none;"></p>
            </div>
          `;
        } catch (error) {
          console.error('Supabase error:', error);
          document.getElementById('status').textContent = 'Error: ' + error.message;
        }
      } else {
        document.getElementById('status').textContent = 'Supabase library not loaded';
      }
    }, 1500);

    async function handleLogin(e) {
      e.preventDefault();
      if (!supabase) {
        alert('Supabase not initialized');
        return;
      }

      var email = document.getElementById('email').value;
      var password = document.getElementById('password').value;

      try {
        var result = await supabase.auth.signInWithPassword({ email: email, password: password });
        if (result.error) {
          document.getElementById('message').textContent = 'Error: ' + result.error.message;
          document.getElementById('message').style.display = 'block';
        } else {
          alert('Login successful!');
        }
      } catch (error) {
        document.getElementById('message').textContent = 'Error: ' + error.message;
        document.getElementById('message').style.display = 'block';
      }
    }
  </script>
</body>
</html>
